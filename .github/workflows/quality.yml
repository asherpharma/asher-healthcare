name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install locked booking alert worker dependencies
        # npm 10 misresolves the reviewed nested gaxios -> uuid override.
        # Pin only this installer; preserve the lockfile and UUID security patch.
        run: npm exec --yes --package=npm@11.6.0 --ignore-scripts --no-audit --no-fund -- npm ci --prefix notification-functions --ignore-scripts --no-audit --no-fund

      - name: Check booking alert worker without sending notifications
        working-directory: notification-functions
        env:
          ALERTS_ENABLED: "false"
        run: |
          npm run check
          npm run test:dependencies
          node --input-type=module -e "import { getApps } from 'firebase-admin/app'; const worker = await import('./index.mjs'); if (typeof worker.appointmentBooked !== 'function') throw new Error('Missing appointment trigger export'); if (getApps().length !== 0) throw new Error('Worker must not initialize Firebase during module import');"

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Firestore security rules
        run: npm run test:rules

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify booking alert privacy and delivery
        run: npm run test:booking-alerts

      - name: Run lint checks
        run: npm run lint

      - name: Verify production build
        run: npm run build
