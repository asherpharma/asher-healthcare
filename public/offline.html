<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#233A59" />
    <title>Asher Staff · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #233a59;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 430px);
        padding: 32px 26px;
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        background: white;
        text-align: center;
        box-shadow: 0 24px 70px rgba(35, 58, 89, 0.12);
      }
      img { width: 82px; height: 82px; object-fit: contain; }
      h1 { margin: 22px 0 8px; font-size: 1.65rem; }
      p { margin: 0; color: #64748b; line-height: 1.65; }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 16px;
        background: #233a59;
        color: white;
        font-weight: 750;
        cursor: pointer;
      }
      small { display: block; margin-top: 18px; color: #94a3b8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Asher Healthcare" />
      <h1>You are offline</h1>
      <p>Reconnect to the internet to securely access appointments and patient records.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>For privacy, medical and billing information is never saved in the offline cache.</small>
    </main>
  </body>
</html>
