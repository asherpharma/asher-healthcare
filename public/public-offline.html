<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d2b45" />
    <title>Asher Healthcare - Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 15% 5%, #e4f2ee 0, transparent 34%),
          linear-gradient(145deg, #fffefb, #f2f7f6);
        color: #0d2b45;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 34px 26px;
        border: 1px solid #d9e5e5;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.94);
        text-align: center;
        box-shadow: 0 24px 70px rgba(13, 43, 69, 0.12);
      }
      img { width: 84px; height: 84px; object-fit: contain; }
      small {
        display: block;
        margin-top: 18px;
        color: #a06f27;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 { margin: 10px 0 10px; font-family: Georgia, serif; font-size: clamp(1.8rem, 8vw, 2.35rem); }
      p { margin: 0; color: #5d6f79; line-height: 1.65; }
      button, a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        font-weight: 750;
        text-decoration: none;
      }
      button {
        width: 100%;
        margin-top: 24px;
        border: 0;
        background: #0d2b45;
        color: white;
        cursor: pointer;
      }
      a { margin-top: 10px; padding: 0 18px; color: #246d6a; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Asher Healthcare" />
      <small>Connection unavailable</small>
      <h1>You&apos;re temporarily offline.</h1>
      <p>Reconnect to view current appointment availability and the latest clinic information.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="tel:+919019263709">Call the clinic - +91 90192 63709</a>
    </main>
  </body>
</html>
